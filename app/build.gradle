plugins {
    id 'com.android.application'
}

def syncWebAssets = tasks.register("syncWebAssets", Copy) {
    from(rootProject.projectDir) {
        include "index.html"
        include "css/**"
        include "js/**"
        include "manifest.json"
        include "sw.js"
        include "icons/**"
    }
    into(layout.projectDirectory.dir("src/main/assets"))
}

tasks.named("preBuild").configure {
    dependsOn(syncWebAssets)
}

android {
    namespace 'com.lumiweg.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lumiweg.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        debug {
            // Permite inspeccionar el WebView con chrome://inspect mientras se prueba.
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
